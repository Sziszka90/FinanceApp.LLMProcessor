name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
      image_tag:
        description: "Docker image tag"
        required: false
        default: "latest"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (PAT)
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.event.inputs.image_tag || 'latest' }}"
          docker build -t ghcr.io/$OWNER/finance-app-llmprocessor:$TAG -f ./LLMProcessor.Dockerfile .

      - name: Push Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.event.inputs.image_tag || 'latest' }}"
          docker push ghcr.io/$OWNER/finance-app-llmprocessor:$TAG
   
      - name: Trigger Infrastructure Deployment
        run: |
          gh workflow run deploy.yml \
            -R Sziszka90/FinanceApp.Infrastructure.Azure \
            --ref main
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
